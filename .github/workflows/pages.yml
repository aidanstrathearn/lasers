name: Deploy Laser Solver

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1

      - name: Update myplotlib to latest commit
        run: cargo update -p myplotlib

      - name: Install cargo-myplotlib
        run: |
          cargo install \
            --git https://github.com/aidanstrathearn/myplotlib.git \
            cargo-myplotlib \
            --locked

      - name: Build web app
        working-directory: examples/dfb-example
        run: |
          cargo myplotlib build-web \
            --manifest-path Cargo.toml \
            --out-dir dist/pkg \
            --release \
            --locked
          cp index.html dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: examples/dfb-example/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
