[package]
name = "laser-solver"
version.workspace = true
edition.workspace = true
publish = false

[workspace]
members = [".", "examples/dfb-example"]
default-members = [".", "examples/dfb-example"]
exclude = ["tools/solver-lab"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[dev-dependencies]
criterion = "0.7"

[[bench]]
name = "dfb-solvers"
harness = false

[[bench]]
name = "propagation-steps"
harness = false
