[workspace]
members = [
    "apps/desktop",
    "apps/web",
    "crates/laser-app",
    "crates/laser-solver",
]
exclude = ["tools/solver-lab"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
eframe = { version = "0.33.3", default-features = false }
laser-app = { path = "crates/laser-app" }
laser-solver = { path = "crates/laser-solver" }
myplotlib = { git = "https://github.com/aidanstrathearn/myplotlib.git" }
