[workspace]
members = [
    "apps/desktop",
    "apps/web",
    "crates/laser-app",
    "crates/laser-solver",
    "tools/solver-lab",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
eframe = { version = "0.33.3", default-features = false }
egui_plot = "0.34.1"
laser-app = { path = "crates/laser-app" }
laser-solver = { path = "crates/laser-solver" }
web-time = "1.1.0"
